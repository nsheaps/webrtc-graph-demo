name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC every day
  workflow_dispatch:

jobs:
  nightly-test:
    name: Nightly Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run validate

      - name: Run security audit
        run: npm run security:audit

  dependency-update-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Create issue for outdated dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              const outdated = execSync('npm outdated --json').toString();
              if (outdated) {
                const packages = JSON.parse(outdated);
                const packageList = Object.keys(packages).join(', ');
                
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '[Nightly] Outdated Dependencies Detected',
                  body: `The following packages have updates available:\n\n${packageList}\n\nRun \`npm outdated\` for details.`,
                  labels: ['dependencies', 'automated']
                });
              }
            } catch (error) {
              console.log('No outdated dependencies or error checking');
            }
        continue-on-error: true
